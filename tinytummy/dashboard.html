<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<style>
:root {
  --cream:#fff8f0; --paper:#ffffff; --ink:#3d3229; --soft:#8a7a6b;
  --carrot:#f28c38; --carrot-dark:#d9731f; --pea:#7fb069; --pea-dark:#5e8c4a;
  --berry:#d95d76; --sky:#4a90c4; --line:#f0e4d6;
  --ok:#5e8c4a; --warn:#c98a1b; --bad:#b23a48;
  --radius:14px; --shadow:0 4px 18px rgba(61,50,41,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Quicksand','Segoe UI',system-ui,sans-serif; background:var(--cream); color:var(--ink); line-height:1.5; font-size:15px; }
h1,h2,h3,h4,.logo { font-family:'Baloo 2','Quicksand',sans-serif; }
a { color:inherit; }
button { font-family:inherit; cursor:pointer; }
input,select,textarea { font-family:inherit; font-size:.92rem; padding:7px 10px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); }
input:focus,select:focus,textarea:focus { outline:2px solid var(--carrot); border-color:var(--carrot); }

.app { display:flex; min-height:100vh; }
aside { width:225px; background:var(--ink); color:#efe6db; padding:16px 10px; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; }
aside .logo { color:var(--carrot); font-size:1.25rem; padding:4px 10px 14px; display:block; }
aside .logo small { display:block; font-size:.6rem; color:#b7a897; letter-spacing:.1em; font-family:'Quicksand'; }
aside nav a { display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:9px; font-weight:600; font-size:.88rem; text-decoration:none; cursor:pointer; margin-bottom:2px; }
aside nav a:hover { background:rgba(255,255,255,.08); }
aside nav a.active { background:var(--carrot); color:#fff; }
aside nav .grp { font-size:.66rem; letter-spacing:.12em; color:#8a7a6b; padding:12px 12px 4px; text-transform:uppercase; }
aside .who { margin-top:14px; padding:10px 12px; background:rgba(255,255,255,.06); border-radius:10px; font-size:.8rem; }
aside .who select { width:100%; margin-top:6px; background:#4a4036; color:#efe6db; border-color:#5a5046; }

main { flex:1; padding:22px 26px 60px; min-width:0; }
.pagehead { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
.pagehead h1 { font-size:1.5rem; }
.pagehead .sub { color:var(--soft); font-size:.88rem; }

.demo-note { background:#e8f1fa; border:1px solid #c4dcf0; border-radius:10px; padding:9px 14px; font-size:.83rem; color:#2f5a80; margin-bottom:16px; }
.demo-note b { color:#1d4568; }

.view { display:none; } .view.on { display:block; }

.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
.kpi { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
.kpi .v { font-family:'Baloo 2'; font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; }
.kpi .l { font-size:.76rem; color:var(--soft); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.kpi.good .v { color:var(--ok); } .kpi.warn .v { color:var(--warn); } .kpi.bad .v { color:var(--bad); }

.panel { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:18px; }
.panel h3 { margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.toolbar h3 { margin-bottom:0; }

.tbl-scroll { overflow-x:auto; }
table.t { width:100%; border-collapse:collapse; font-size:.88rem; }
table.t th, table.t td { padding:8px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
table.t th { color:var(--soft); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
table.t td.num, table.t th.num { text-align:right; font-variant-numeric:tabular-nums; }
table.t tr:hover td { background:#fffcf7; }

.btn { display:inline-block; text-decoration:none; font-weight:700; border-radius:999px; padding:8px 16px; border:none; font-size:.85rem; }
.btn.p { background:var(--carrot); color:#fff; } .btn.p:hover { background:var(--carrot-dark); }
.btn.o { background:transparent; color:var(--carrot-dark); border:2px solid var(--carrot); }
.btn.g { background:var(--pea); color:#fff; }
.btn.r { background:var(--berry); color:#fff; }
.btn.s { padding:4px 11px; font-size:.78rem; }
.btn:focus-visible { outline:3px solid var(--carrot-dark); outline-offset:2px; }

.chip { display:inline-block; font-size:.72rem; font-weight:700; border-radius:999px; padding:3px 10px; white-space:nowrap; }
.chip.new { background:#fde7e7; color:var(--bad); }
.chip.confirmed { background:#e8f1fa; color:#2f5a80; }
.chip.kitchen { background:#fdf3e3; color:#7a5c2e; }
.chip.portioning { background:#fdf3e3; color:#7a5c2e; }
.chip.qc { background:#efe9fa; color:#5b4a8a; }
.chip.dispatch { background:#e8f1fa; color:#2f5a80; }
.chip.delivering { background:#e8f1fa; color:#2f5a80; }
.chip.delivered { background:#eef5e6; color:var(--ok); }
.chip.cancelled { background:#eee; color:#777; }
.chip.done { background:#eef5e6; color:var(--ok); }
.chip.progress { background:#fdf3e3; color:var(--warn); }
.chip.todo { background:#fde7e7; color:var(--bad); }
.chip.open { background:#fde7e7; color:var(--bad); }
.chip.investigating { background:#fdf3e3; color:var(--warn); }
.chip.escalated { background:#efe9fa; color:#5b4a8a; }
.chip.resolved { background:#eef5e6; color:var(--ok); }
.chip.low { background:#fde7e7; color:var(--bad); }
.chip.fefo { background:#e8f1fa; color:#2f5a80; }
.chip.exp { background:#fdf3e3; color:var(--warn); }
.chip.auto { background:#efe9fa; color:#5b4a8a; }

.bar-wrap { background:var(--line); border-radius:999px; height:10px; overflow:hidden; }
.bar-fill { height:100%; background:var(--pea); border-radius:999px; transition:width .3s; }
@media (prefers-reduced-motion:reduce){ .bar-fill{transition:none;} }

.timeline { list-style:none; padding-left:4px; }
.timeline li { position:relative; padding:0 0 12px 22px; border-left:2px solid var(--line); margin-left:6px; font-size:.84rem; }
.timeline li::before { content:''; position:absolute; left:-6px; top:2px; width:10px; height:10px; border-radius:50%; background:var(--carrot); }
.timeline li b { display:block; }
.timeline li span { color:var(--soft); font-size:.76rem; }

.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:900px){ .grid2{grid-template-columns:1fr;} aside{width:64px;} aside .logo small,aside nav a em,aside .grp,aside .who{display:none;} aside nav a{justify-content:center;padding:10px;} main{padding:16px;} }
aside nav a em { font-style:normal; }

.steps { display:flex; flex-wrap:wrap; gap:6px; }
.steps label { display:flex; align-items:center; gap:5px; background:var(--cream); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:.78rem; font-weight:700; cursor:pointer; }
.steps label.done { background:#eef5e6; border-color:#cfe3c2; color:var(--ok); }

.chat-box { display:flex; flex-direction:column; height:420px; }
.chat-msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:8px 4px; }
.msg { max-width:75%; background:var(--cream); border:1px solid var(--line); border-radius:12px 12px 12px 3px; padding:7px 11px; font-size:.86rem; }
.msg.me { align-self:flex-end; background:#eef5e6; border-radius:12px 12px 3px 12px; }
.msg b { display:block; font-size:.72rem; color:var(--carrot-dark); }
.msg span.ts { display:block; font-size:.68rem; color:var(--soft); margin-top:2px; }
.chat-send { display:flex; gap:8px; margin-top:8px; }
.chat-send input { flex:1; }
.chan { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.chan button { border:2px solid var(--carrot); background:transparent; color:var(--carrot-dark); border-radius:999px; padding:5px 14px; font-weight:700; font-size:.8rem; }
.chan button.active { background:var(--carrot); color:#fff; }

.matrix td, .matrix th { text-align:center; }
.matrix td:first-child, .matrix th:first-child { text-align:left; }
.matrix input[type=checkbox]{ width:17px; height:17px; accent-color:var(--pea); }

.muted { color:var(--soft); font-size:.84rem; }
.pill-row { display:flex; gap:6px; flex-wrap:wrap; }
dialog { border:none; border-radius:var(--radius); box-shadow:0 12px 50px rgba(0,0,0,.25); padding:20px; max-width:640px; width:92vw; max-height:85vh; overflow-y:auto; }
dialog::backdrop { background:rgba(61,50,41,.45); }
.frm { display:grid; gap:10px; }
.frm label { font-weight:700; font-size:.82rem; display:grid; gap:4px; }
.frm .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>

}

/* ── lookups ── */
function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function productCost(pid, bom, ings) {
  var c = 0;
  bom.forEach(function (b) { if (b.product === pid) { var g = byId(ings, b.ing); if (g) c += b.qty * g.cost; } });
  return c;
}
function stockOf(ingId, lots) {
  var s = 0; lots.forEach(function (l) { if (l.ing === ingId) s += l.qty; }); return s;
}
function orderTotals(o, products, bom, ings) {
  var rev = 0, cost = 0;
  (o.items || []).forEach(function (it) {
    var p = byId(products, it.product); if (!p) return;
    rev += p.price * it.qty;
    cost += productCost(p.id, bom, ings) * it.qty;
  });
  return { rev: rev, cost: cost, margin: rev - cost, pct: rev ? Math.round((rev - cost) / rev * 100) : 0 };
}

/* ── FEFO consumption + auto-requisition ── */
function consumeFEFO(order) {
  var lots = store('lots').all();
  var ings = store('ingredients').all();
  var bom = store('bom').all();
  var need = {}; // ingId -> qty
  order.items.forEach(function (it) {
    bom.forEach(function (b) {
      if (b.product === it.product) need[b.ing] = (need[b.ing] || 0) + b.qty * it.qty;
    });
  });
  var picked = [];
  Object.keys(need).forEach(function (ingId) {
    var remaining = need[ingId];
    var mine = lots.filter(function (l) { return l.ing === ingId && l.qty > 0; })
      .sort(function (a, b) { return a.expiry < b.expiry ? -1 : 1; }); // FEFO: earliest expiry first
    mine.forEach(function (l) {
      if (remaining <= 0) return;
      var take = Math.min(l.qty, remaining);
      l.qty = Math.round((l.qty - take) * 1000) / 1000;
      remaining = Math.round((remaining - take) * 1000) / 1000;
      var g = byId(ings, ingId);
      picked.push(take + ' ' + (g ? g.unit : '') + ' ' + (g ? g.name : ingId) + ' ← lot ' + l.lot);
    });
    if (remaining > 0) {
      var g2 = byId(ings, ingId);
      picked.push('⚠️ SHORT ' + remaining + ' ' + (g2 ? g2.unit + ' ' + g2.name : ingId));
    }
  });
  store('lots').save(lots);
  // auto-requisition anything now below minimum
  var reqs = store('requisitions').all();
  var opened = [];
  ings.forEach(function (g) {
    var s = stockOf(g.id, lots);
    var already = reqs.some(function (r) { return r.ing === g.id && r.status === 'open'; });
    if (s < g.min && !already) {
      reqs.push({ id: uid(), ing: g.id, qty: g.reorder, reason: 'auto', status: 'open',
        note: g.name + ' fell below minimum (' + s + ' ' + g.unit + ' left) after ' + order.code, created: today(0) });
      opened.push(g.name);
    }
  });
  store('requisitions').save(reqs);
  if (opened.length) pushDemo('Stock low ⚠️', opened.join(', ') + ' below minimum — auto-requisition opened', 'Role · kitchen');
  return picked;
}

function pushDemo(title, body, audience) {
  var log = store('pushlog').all();
  var row = { id: uid(), title: title, body: body, audience: audience, sent: nowTs(), delivered: '', opened: '' };
  log.unshift(row);
  store('pushlog').save(log);
  setTimeout(function () { // simulate the device receipt, like push_receipts in the municipality build
    var l2 = store('pushlog').all();
    var r2 = byId(l2, row.id); if (r2) { r2.delivered = nowTs(); store('pushlog').save(l2); if (location.hash === '#notify') render(); }
  }, 1500);
}

/* Live recommendations computed from the actual data — not a static list. */
function adviseHtml() {

      products = store('products').all(), bom = store('bom').all(),
      iso = store('iso').all(), comps = store('complaints').all(),

  });
  lots.forEach(function (l) {
    if (l.qty > 0 && l.expiry <= today(3)) {
      var g = byId(ings, l.ing);
      tips.push('⏳ Lot <b>' + esc(l.lot) + '</b> (' + esc(g ? g.name : '') + ') expires ' + esc(l.expiry) + ' — FEFO will pick it first, but plan a recipe that uses it or write it off.');
    }
  });
  products.forEach(function (p) {
    var c = productCost(p.id, bom, ings);
    if (p.price && c && (p.price - c) / p.price < 0.5)
      tips.push('💰 <b>' + esc(p.name) + '</b> margin is under 50% (' + Math.round((p.price - c) / p.price * 100) + '%) — review the price or the BOM quantities.');
  });
  comps.forEach(function (c) {
    if (c.status !== 'resolved' && c.sla <= today(0))
      tips.push('🚨 <b>' + esc(c.code) + '</b> is at/past its SLA — resolve or escalate today; an aging case is the fastest way to lose a family.');
  });
  var todoHaccp = iso.filter(function (i) { return i.status === 'todo' && i.clause.indexOf('HACCP') >= 0; });

  var stuck = orders.filter(function (o) { return o.status === 'new'; });
  if (stuck.length) tips.push('🛒 ' + stuck.length + ' order(s) still unconfirmed — confirm before the 3 PM cutoff to keep the next-day promise.');
  if (!tips.length) tips.push('✅ Nothing urgent — stock, margins, cases and ISO are all inside their limits.');
  return '<ul style="margin:6px 0 0 18px;font-size:.86rem;display:grid;gap:6px">' +

}

    var c = productCost(it.product, bom, ings);
    return '<tr><td>' + esc(p ? p.name : '?') + '</td><td class="num">' + it.qty + '</td>' +
      '<td class="num">' + money(p ? p.price : 0) + '</td><td class="num">' + money(c) + '</td>' +
      '<td class="num">' + money((p ? p.price : 0) - c) + '</td></tr>';
  }).join('');
  var hist = o.history.map(function (h) { return '<li><b>' + esc(h.what) + '</b><span>' + esc(h.at) + '</span></li>'; }).join('');
  var steps = KITCHEN_STEPS.map(function (s) {
    var st = o.steps.find(function (x) { return x.s === s; });
    var done = st && st.done;
    return '<label class="' + (done ? 'done' : '') + '"><input type="checkbox" ' + (done ? 'checked' : '') +
      ' onchange="stepToggle(\'' + o.id + '\',\'' + s + '\',this.checked)">' + s + '</label>';
  }).join('');
  var agentOpts = agents.filter(function (a) { return a.active; })
    .map(function (a) { return '<option value="' + a.id + '"' + (o.agent === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('');
  var actions = '';
  if (o.status === 'new') actions = '<button class="btn p" onclick="orderAct(\'' + o.id + '\',\'confirm\')">✓ Confirm order</button>';
  else if (o.status === 'confirmed') actions = '<button class="btn p" onclick="orderAct(\'' + o.id + '\',\'tokitchen\')">👨‍🍳 Send to kitchen (consume stock FEFO)</button>';
  else if (o.status === 'kitchen' || o.status === 'portioning') actions = '<button class="btn p" onclick="orderAct(\'' + o.id + '\',\'qc\')">🔎 Kitchen done → QC</button>';
  else if (o.status === 'qc') actions = '<button class="btn g" onclick="orderAct(\'' + o.id + '\',\'qcpass\')">✅ QC pass → ready to dispatch</button>';
  else if (o.status === 'dispatch') actions = '<select id="dl-agent">' + agentOpts + '</select> <button class="btn p" onclick="orderAct(\'' + o.id + '\',\'dispatch\')">🚚 Dispatch with agent</button>';
  else if (o.status === 'delivering') actions = '<button class="btn g" onclick="orderAct(\'' + o.id + '\',\'delivered\')">📦 Mark delivered</button>';
  if (o.status !== 'delivered' && o.status !== 'cancelled')
    actions += ' <button class="btn r s" onclick="orderAct(\'' + o.id + '\',\'cancel\')">✕ Cancel</button>';

  showDlg('<h3>' + esc(o.code) + ' — ' + esc(o.customer) + ' <span class="chip ' + o.status + '">' + o.status + '</span></h3>' +
    '<p class="muted">' + esc(o.phone) + ' · ' + esc(o.address) + '</p>' +
    '<div class="tbl-scroll" style="margin:12px 0"><table class="t"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Cost (BOM)</th><th class="num">Margin</th></tr></thead>' +
    '<tbody>' + items + '</tbody>' +
    '<tfoot><tr><th colspan="2">Totals</th><th class="num">' + money(t.rev) + '</th><th class="num">' + money(t.cost) + '</th><th class="num">' + money(t.margin) + ' (' + t.pct + '%)</th></tr></tfoot></table></div>' +
    '<h4>👨‍🍳 Kitchen steps</h4><div class="steps" style="margin:8px 0 14px">' + steps + '</div>' +
    '<div class="pill-row" style="margin-bottom:14px">' + actions + '</div>' +
    '<h4>📍 Tracking</h4><ul class="timeline" style="margin-top:8px">' + hist + '</ul>');
}

function stepToggle(oid, step, checked) {
  var orders = store('orders').all(); var o = byId(orders, oid); if (!o) return;
  var st = o.steps.find(function (x) { return x.s === step; });
  if (st) st.done = checked; else o.steps.push({ s: step, done: checked });
  if (step === 'Portioning' && checked && o.status === 'kitchen') o.status = 'portioning';
  store('orders').save(orders);
  openOrder(oid); render();
}

function orderAct(oid, act) {
  var orders = store('orders').all(); var o = byId(orders, oid); if (!o) return;
  function log(w) { o.history.push({ at: nowTs(), what: w }); }
  if (act === 'confirm') { o.status = 'confirmed'; log('Order confirmed'); pushDemo('Order confirmed 🥕', o.code + ' is confirmed and heading to the kitchen', 'Customer · ' + o.customer); }
  if (act === 'tokitchen') {
    var picked = consumeFEFO(o);
    o.status = 'kitchen';
    log('Sent to kitchen · stock consumed FEFO: ' + picked.join(' · '));
  }
  if (act === 'qc') { o.status = 'qc'; log('Kitchen complete — waiting QC'); }
  if (act === 'qcpass') { o.status = 'dispatch'; log('QC passed ✓ ready for dispatch'); }
  if (act === 'dispatch') {
    var sel = document.getElementById('dl-agent');
    o.agent = sel ? sel.value : null;
    var agents = store('agents').all(); var a = byId(agents, o.agent);
    o.status = 'delivering'; log('Dispatched with ' + (a ? a.name : 'agent'));
    pushDemo('Out for delivery 🚚', o.code + ' is on the way with ' + (a ? a.name : 'our agent'), 'Customer · ' + o.customer);
  }
  if (act === 'delivered') { o.status = 'delivered'; log('Delivered ✓'); pushDemo('Delivered 📦', 'Enjoy! Rate your ' + o.code + ' meals', 'Customer · ' + o.customer); }
  if (act === 'cancel') { if (!confirm('Cancel this order?')) return; o.status = 'cancelled'; log('Order cancelled'); }
  store('orders').save(orders);
  openOrder(oid); render();
}

/* ── ISO 22000 ── */
RENDER.iso = function () {
  var iso = store('iso').all();
  var clauses = [];
  iso.forEach(function (i) { if (clauses.indexOf(i.clause) < 0) clauses.push(i.clause); });
  var done = iso.filter(function (i) { return i.status === 'done'; }).length;
  var pct = Math.round(done / iso.length * 100);
  var groups = clauses.map(function (c) {
    var mine = iso.filter(function (i) { return i.clause === c; });
    var d = mine.filter(function (i) { return i.status === 'done'; }).length;
    var rows = mine.map(function (i) {
      return '<tr><td>' + esc(i.item) + '</td>' +
        '<td><select onchange="isoSet(\'' + i.id + '\',\'status\',this.value)">' +
        ['done', 'progress', 'todo'].map(function (s) {
          var lbl = s === 'done' ? '✅ done' : s === 'progress' ? '🟡 in progress' : '🔴 not done';
          return '<option value="' + s + '"' + (i.status === s ? ' selected' : '') + '>' + lbl + '</option>';
        }).join('') + '</select></td>' +
        '<td><input value="' + esc(i.owner) + '" placeholder="owner" style="width:110px" onchange="isoSet(\'' + i.id + '\',\'owner\',this.value)"></td>' +
        '<td><input value="' + esc(i.evidence) + '" placeholder="evidence / doc ref" style="width:150px" onchange="isoSet(\'' + i.id + '\',\'evidence\',this.value)"></td></tr>';
    }).join('');
    return '<div class="panel"><h3>' + esc(c) + ' <span class="muted" style="font-family:Quicksand;font-size:.8rem">' + d + '/' + mine.length + '</span></h3>' +
      '<div class="tbl-scroll"><table class="t"><thead><tr><th>Requirement</th><th>Flag</th><th>Owner</th><th>Evidence</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }).join('');
  return '<div class="pagehead"><div><h1>🛡️ ISO 22000 checklist</h1><div class="sub">Food safety management readiness sheet, clause by clause — flag each item done / in progress / not done. (Working summary; certification uses the official standard text.)</div></div>' +
    '<div class="pill-row"><button class="btn o s" onclick="isoCsv()">📋 Copy as CSV sheet</button></div></div>' +
    '<div class="panel"><div class="toolbar"><h3>Overall readiness</h3><b>' + pct + '%</b></div>' +
    '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>' + groups;
};
function isoSet(id, field, value) {
  var iso = store('iso').all(); var i = byId(iso, id);
  if (i) { i[field] = value; store('iso').save(iso); }
  if (field === 'status') render();
}
function isoCsv() {
  var iso = store('iso').all();
  var lines = ['Clause,Requirement,Status,Owner,Evidence'];
  iso.forEach(function (i) {
    lines.push('"' + i.clause + '","' + i.item.replace(/"/g, '""') + '","' + i.status + '","' + (i.owner || '') + '","' + (i.evidence || '') + '"');
  });
  var csv = lines.join('\n');
  if (navigator.clipboard) navigator.clipboard.writeText(csv).then(function () { alert('CSV copied — paste into Excel / Google Sheets. (Also committed as tinytummy/iso22000-checklist.csv)'); });
  else alert(csv);
}

function openCase(id) {
  var comps = store('complaints').all(); var c = byId(comps, id); if (!c) return;
  var log = c.log.map(function (h) { return '<li><b>' + esc(h.what) + '</b><span>' + esc(h.at) + '</span></li>'; }).join('');
  var acts = '';
  if (c.status !== 'resolved') {
    if (c.status !== 'escalated') acts += '<button class="btn o s" onclick="caseAct(\'' + c.id + '\',\'escalate\')">⤴ Escalate to manager</button> ';
    acts += '<button class="btn g s" onclick="caseAct(\'' + c.id + '\',\'resolve\')">✅ Resolve case</button> ';
    acts += '<button class="btn p s" onclick="caseAct(\'' + c.id + '\',\'note\')">＋ Add note</button>';
  }
  showDlg('<h3>' + esc(c.code) + ' <span class="chip ' + c.status + '">' + c.status + '</span></h3>' +
    '<p class="muted">' + esc(c.customer) + ' · ' + esc(c.phone) + ' · order ' + esc(c.order) + ' · SLA ' + esc(c.sla) + '</p>' +
    '<p style="margin:10px 0"><b>' + esc(c.summary) + '</b></p>' +
    '<div class="pill-row" style="margin-bottom:12px">' + acts + '</div>' +
    '<h4>Case log</h4><ul class="timeline" style="margin-top:8px">' + log + '</ul>');
}
function caseAct(id, act) {
  var comps = store('complaints').all(); var c = byId(comps, id); if (!c) return;
  if (act === 'escalate') {
    c.status = 'escalated'; c.escalatedTo = 'Lina — Manager';
    c.log.push({ at: nowTs(), what: 'Escalated to Lina — Manager' });
    pushDemo('Case escalated ⤴', c.code + ': ' + c.summary, 'Role · manager');
  }
  if (act === 'resolve') { c.status = 'resolved'; c.log.push({ at: nowTs(), what: 'Resolved ✓ customer informed' }); }
  if (act === 'note') {
    var n = prompt('Note to add to the case log:');
    if (!n) return;
    c.log.push({ at: nowTs(), what: n });
    if (c.status === 'open') c.status = 'investigating';
  }
  store('complaints').save(comps);
  openCase(id); render();
}
function newCase() {
  showDlg('<h3>＋ New case</h3><div class="frm" style="margin-top:10px">' +
    '<div class="row"><label>Customer<input id="nc-name"></label><label>Phone<input id="nc-phone"></label></div>' +
    '<div class="row"><label>Order code<input id="nc-order" placeholder="TT-2026-…"></label><label>Severity<select id="nc-sev"><option>low</option><option selected>medium</option><option>high</option></select></label></div>' +
    '<label>What happened<textarea id="nc-sum" rows="3"></textarea></label>' +
    '<button class="btn p" onclick="saveCase()">Open case</button></div>');
}
function saveCase() {
  var comps = store('complaints').all();
  comps.unshift({ id: uid(), code: 'CASE-0' + (comps.length + 14), order: document.getElementById('nc-order').value,
    customer: document.getElementById('nc-name').value, phone: document.getElementById('nc-phone').value,
    summary: document.getElementById('nc-sum').value, severity: document.getElementById('nc-sev').value,
    status: 'open', assigned: currentUser().name, escalatedTo: null, sla: today(2),
    log: [{ at: nowTs(), what: 'Case opened by ' + currentUser().name }], created: today(0) });
  store('complaints').save(comps);
  closeDlg(); render();
}

/* ── Chat ── */
var chatChannel = 'kitchen';
RENDER.chat = function () {
  var chans = ['kitchen', 'delivery', 'management'];
  var btns = chans.map(function (c) {
    return '<button class="' + (chatChannel === c ? 'active' : '') + '" onclick="chatGo(\'' + c + '\')">#' + c + '</button>';
  }).join('');
  var msgs = store('chat').all().filter(function (m) { return m.channel === chatChannel; });
  var me = currentUser().name;
  var html = msgs.map(function (m) {
    return '<div class="msg' + (m.sender === me ? ' me' : '') + '"><b>' + esc(m.sender) + '</b>' + esc(m.text) +
      '<span class="ts">' + esc(m.at) + '</span></div>';
  }).join('');
  return '<div class="pagehead"><div><h1>💬 Team Chat</h1><div class="sub">Kitchen ↔ delivery ↔ management in one place — stock alerts and escalations land here too</div></div></div>' +
    '<div class="panel"><div class="chan">' + btns + '</div>' +
    '<div class="chat-box"><div class="chat-msgs" id="chatmsgs">' + html + '</div>' +
    '<div class="chat-send"><input id="chat-in" placeholder="Message #' + chatChannel + '…" onkeydown="if(event.key===\'Enter\')chatSend()">' +
    '<button class="btn p" onclick="chatSend()">Send</button></div></div></div>';
};
AFTER.chat = function () { var el = document.getElementById('chatmsgs'); if (el) el.scrollTop = el.scrollHeight; };
function chatGo(c) { chatChannel = c; render(); }
function chatSend() {
  var inp = document.getElementById('chat-in'); if (!inp || !inp.value.trim()) return;
  var chat = store('chat').all();
  chat.push({ id: uid(), channel: chatChannel, sender: currentUser().name, text: inp.value.trim(), at: nowTs() });
  store('chat').save(chat);
  render();
}

/* ── Notifications ── */
RENDER.notify = function () {
  var log = store('pushlog').all();
  var rows = log.map(function (n) {
    return '<tr><td><b>' + esc(n.title) + '</b><br><span class="muted">' + esc(n.body) + '</span></td>' +
      '<td>' + esc(n.audience) + '</td>' +
      '<td>' + (n.sent ? '✅<br><span class="muted">' + esc(n.sent) + '</span>' : '—') + '</td>' +
      '<td>' + (n.delivered ? '📲<br><span class="muted">' + esc(n.delivered) + '</span>' : '<span class="muted">…</span>') + '</td>' +
      '<td>' + (n.opened ? '👁<br><span class="muted">' + esc(n.opened) + '</span>' : '<span class="muted">—</span>') + '</td></tr>';
  }).join('');
  return '<div class="pagehead"><div><h1>🔔 Notifications</h1><div class="sub">Same doctrine as the municipality build: <b>Sent</b>, <b>Delivered</b> and <b>Opened</b> are three different facts, tracked apart — and a send with no audience is refused</div></div></div>' +
    '<div class="panel"><h3>📣 Compose push</h3><div class="frm">' +
    '<div class="row"><label>Title<input id="pn-title" placeholder="e.g. Friday menu is out 🥕"></label>' +
    '<label>Audience<select id="pn-aud"><option>Role · manager</option><option>Role · kitchen</option><option>Role · delivery</option><option>All customers</option><option>Program · First Tastes</option><option>Program · Little Explorers</option><option>Program · Toddler Table</option><option>Program · Big Kids Club</option></select></label></div>' +
    '<label>Message<input id="pn-body"></label>' +
    '<button class="btn p" onclick="sendPush()">Send push</button>' +
    '<p class="muted">Order events (confirmed / out for delivery / delivered), stock alerts and case escalations send automatically.</p></div></div>' +
    '<div class="panel"><h3>📬 Push log</h3><div class="tbl-scroll"><table class="t"><thead><tr>' +
    '<th>Notification</th><th>Audience</th><th>Sent</th><th>Delivered</th><th>Opened</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
};
function sendPush() {
  var t = document.getElementById('pn-title').value, b = document.getElementById('pn-body').value;
  if (!t) { alert('Title required'); return; }
  pushDemo(t, b, document.getElementById('pn-aud').value);
  render();
}

/* ── Age Programs ── */
RENDER.programs = function () {
  var progs = store('programs').all();
  var cards = progs.map(function (p) {
    return '<div class="panel"><h3>👶 ' + esc(p.name) + ' <span class="chip fefo">' + esc(p.band) + '</span></h3>' +
      '<p class="muted" style="margin-bottom:8px">' + esc(p.desc) + '</p>' +
      '<p style="font-size:.86rem"><b>Weekly plan:</b> ' + esc(p.menu) + '</p>' +
      '<div class="toolbar" style="margin-top:10px"><span><b>' + money(p.price) + '</b>/month · <b>' + p.enrolled + '</b> enrolled</span>' +
      '<span class="pill-row"><button class="btn o s" onclick="progEnroll(\'' + p.id + '\',1)">＋ Enroll</button>' +
      '<button class="btn o s" onclick="progEnroll(\'' + p.id + '\',-1)">−</button></span></div></div>';
  }).join('');
  var totalRev = progs.reduce(function (s, p) { return s + p.price * p.enrolled; }, 0);
  return '<div class="pagehead"><div><h1>👶 Age Programs</h1><div class="sub">Subscription meal programs per age band — weekly plans, enrollment and recurring revenue</div></div>' +
    '<span><b>' + money(totalRev) + '</b> <span class="muted">/month recurring</span></span></div>' +
    '<div class="grid2">' + cards + '</div>';
};
function progEnroll(id, d) {
  var progs = store('programs').all(); var p = byId(progs, id);
  if (p) { p.enrolled = Math.max(0, p.enrolled + d); store('programs').save(progs); render(); }
}

/* ── Users ── */
RENDER.users = function () {
  var staff = store('staff').all();
  var rows = staff.map(function (u) {
    var roleOpts = ROLES.map(function (r) { return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('');
    return '<tr><td><b>' + esc(u.name) + '</b></td><td>' + esc(u.email) + '</td>' +
      '<td><select onchange="setRole(\'' + u.id + '\',this.value)">' + roleOpts + '</select></td></tr>';
  }).join('');
  var rp = store('role_perms').all();
  var head = ROLES.map(function (r) { return '<th>' + r.replace('_', ' ') + '</th>'; }).join('');
  var matrix = PERM_KEYS.map(function (pk) {
    var cells = ROLES.map(function (r) {
      var row = rp.find(function (x) { return x.role === r && x.key === pk[0]; });
      var checked = row && row.allowed;
      var lock = r === 'super_admin';
      return '<td><input type="checkbox" ' + (checked ? 'checked' : '') + (lock ? ' disabled' : '') +
        ' onchange="setPerm(\'' + r + '\',\'' + pk[0] + '\',this.checked)"></td>';
    }).join('');
    return '<tr><td><b>' + pk[0] + '</b><br><span class="muted">' + pk[1] + '</span></td>' + cells + '</tr>';
  }).join('');
  return '<div class="pagehead"><div><h1>👥 Users · Roles</h1><div class="sub">One permission key per capability — role defaults here, per-person overrides in Supabase (has_perm: override → role → super_admin), exactly the municipality pattern</div></div></div>' +
    '<div class="panel"><h3>Team</h3><div class="tbl-scroll"><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="muted" style="margin-top:8px">Real logins are Supabase Auth users; this list maps them to roles.</p></div>' +
    '<div class="panel"><h3>🔐 Permission matrix</h3><div class="tbl-scroll"><table class="t matrix"><thead><tr><th>Permission</th>' + head + '</tr></thead><tbody>' + matrix + '</tbody></table></div>' +
    '<p class="muted" style="margin-top:8px">super_admin always holds everything. Try it: switch the signed-in user (bottom-left) to Chef Nadim and watch the sidebar shrink to his permissions.</p></div>';
};
function setRole(id, role) {
  var staff = store('staff').all(); var u = byId(staff, id);
  if (u) { u.role = role; store('staff').save(staff); render(); }
}
function setPerm(role, key, allowed) {
  var rp = store('role_perms').all();
  var row = rp.find(function (x) { return x.role === role && x.key === key; });
  if (row) row.allowed = allowed; else rp.push({ role: role, key: key, allowed: allowed });
  store('role_perms').save(rp);
}

/* ── Settings ── */
RENDER.settings = function () {
  return '<div class="pagehead"><div><h1>⚙️ Settings</h1></div></div>' +
    '<div class="panel"><h3>🔌 Supabase</h3>' +
    '<p>' + (CONNECTED ? '🟢 URL configured in <code>js/supabase-config.js</code>.' : '🔴 Not connected — the dashboard runs on demo data saved in this browser.') + '</p>' +
    '<ol class="muted" style="margin:10px 0 0 20px">' +
    '<li>Run <b>supabase/schema.sql</b> (site) then <b>supabase/schema2_operations.sql</b> (this dashboard) in the Supabase SQL editor.</li>' +
    '<li>Paste the project URL + anon key into <b>js/supabase-config.js</b>.</li>' +
    '<li>Create staff logins in Supabase → Authentication → Users, then map them to roles in the Users module.</li>' +
    '<li>For real push notifications, deploy the send-push edge function with VAPID keys — same architecture as the municipality: device registry, send log, and per-device delivered/opened receipts.</li></ol></div>' +
    '<div class="panel"><h3>🧪 Demo data</h3><p class="muted">Everything you click is saved in this browser only.</p>' +
    '<p style="margin-top:10px"><button class="btn r s" onclick="resetDemo()">↺ Reset demo data</button></p></div>';
};

/* ── dialog helpers ── */
function showDlg(html) {
  var d = document.getElementById('dlg');
  d.innerHTML = '<div style="display:flex;justify-content:flex-end"><button class="btn o s" onclick="closeDlg()">✕ Close</button></div>' + html;
  if (!d.open) d.showModal();
}
function closeDlg() { document.getElementById('dlg').close(); }

/* ── boot ── */
(function () {
  var sel = document.getElementById('whoami');
  store('staff').all().forEach(function (u) {
    var o = document.createElement('option');
    o.value = u.id; o.textContent = u.name + ' (' + u.role + ')';
    if (u.id === (localStorage.getItem('ttops_whoami') || 'u1')) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', function () {
    localStorage.setItem('ttops_whoami', sel.value);
    render();
  });
  var h = (location.hash || '').replace('#', '');
  nav(VIEWS.indexOf(h) >= 0 ? h : 'overview');
})();
</script>
