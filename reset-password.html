<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إعادة تعيين كلمة المرور — نظام البلديات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1a6eb5;--blue2:#0f4d82;--text:#1a1a2e;--text2:#444;--text3:#888;--border:#e0e6ef;--bg:#f5f7fa;--bg2:#f0f2f7;--danger:#bf2424;--ok:#1e8e3e;--font:'Tahoma',Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);direction:rtl;min-height:100vh;background:linear-gradient(135deg,#eef5fc,#f5f7fa);display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);font-size:14px}
.card{background:#fff;padding:30px 26px;border-radius:18px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(15,77,130,.18);text-align:center}
.lg-logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1a6eb5,#0f4d82);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
h2{font-size:20px;font-weight:900;margin:0 0 4px;color:#0f4d82}
.sub{font-size:13px;color:#8a95a3;margin-bottom:22px;line-height:1.6}
.fg{margin-bottom:12px;text-align:right}
.fl{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font);font-size:14px;outline:none;background:#fff;color:var(--text);direction:ltr}
.fi:focus{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid #1a1a2e;background:#1a1a2e;color:#fff;font-family:var(--font);width:100%;justify-content:center;margin-top:6px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.msg{font-size:12.5px;min-height:18px;margin:10px 0 0;line-height:1.6;padding:0;background:transparent}
.msg.err{background:#fee2e2;color:var(--danger);padding:9px 12px;border-radius:9px;border-right:4px solid var(--danger);text-align:right}
.msg.ok{background:#e6f4ea;color:var(--ok);padding:9px 12px;border-radius:9px;border-right:4px solid var(--ok);text-align:right}
.back{display:inline-block;margin-top:14px;font-size:12.5px;color:#0f4d82;font-weight:700;text-decoration:none}
.spinner{width:36px;height:36px;border:3px solid #daeaf8;border-top-color:#0f4d82;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f4d82">
<script src="pwa-ios.js" defer></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ── phone behaviour, identical on every page ─────────────────────────────
   Applied last so it wins over the page's own rules.
   font-size:16px on form fields is not a style choice: below it, iOS zooms
   the page when a field takes focus and the layout jumps. */
@media (max-width:820px){
  input,select,textarea,button{font-size:16px!important}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
*:focus-visible{outline:2px solid #1a6eb5;outline-offset:2px}
</style>
</head>
<body>

<div class="card" id="CARD">
  <div class="lg-logo">🔐</div>
  <h2>إعادة تعيين كلمة المرور</h2>
  <div class="sub" id="SUB">جاري التحقق من الرابط…</div>
  <div id="BODY" style="display:none">
    <div class="fg">
      <div class="fl">كلمة المرور الجديدة</div>
      <input type="password" id="pw1" class="fi" autocomplete="new-password" minlength="6">
    </div>
    <div class="fg">
      <div class="fl">تأكيد كلمة المرور</div>
      <input type="password" id="pw2" class="fi" autocomplete="new-password" minlength="6">
    </div>
    <button class="btn" id="btn-save">💾 حفظ كلمة المرور الجديدة</button>
    <div id="msg" class="msg"></div>
  </div>
  <div id="LOADING" style="text-align:center">
    <div class="spinner"></div>
  </div>
  <a href="index.html" class="back">← العودة إلى البوابة الرئيسية</a>
</div>

<script>
var SUPABASE_URL = 'https://onjbwhkmmtqnymhjnplw.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uamJ3aGttbXRxbnltaGpucGx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MDY4MjUsImV4cCI6MjA5MDM4MjgyNX0.lhlsRdOqVHZuOXCJa0lCNuZkYJHhf1AZ_zOwqHHAeG4';

var sb = null;
var recoveryReady = false;

function showError(text) {
  var sub = document.getElementById('SUB');
  var loading = document.getElementById('LOADING');
  var body = document.getElementById('BODY');
  sub.innerHTML = '<span style="color:#bf2424;font-weight:700">⚠️ ' + text + '</span>';
  loading.style.display = 'none';
  body.style.display = 'none';
}

function showForm(email) {
  var sub = document.getElementById('SUB');
  var loading = document.getElementById('LOADING');
  var body = document.getElementById('BODY');
  sub.innerHTML = 'أدخل كلمة المرور الجديدة لحساب<br><strong style="direction:ltr;display:inline-block;color:#0f4d82">' + (email || '') + '</strong>';
  loading.style.display = 'none';
  body.style.display = 'block';
  var pw1 = document.getElementById('pw1');
  if (pw1) pw1.focus();
}

async function savePassword() {
  var pw1 = document.getElementById('pw1').value;
  var pw2 = document.getElementById('pw2').value;
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn-save');
  msg.className = 'msg';
  msg.textContent = '';
  if (!pw1 || pw1.length < 6) {
    msg.className = 'msg err';
    msg.textContent = '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
    return;
  }
  if (pw1 !== pw2) {
    msg.className = 'msg err';
    msg.textContent = '⚠️ كلمتا المرور غير متطابقتين';
    return;
  }
  btn.disabled = true;
  btn.textContent = '⏳ جاري الحفظ…';
  try {
    var r = await sb.auth.updateUser({ password: pw1 });
    if (r && r.error) {
      msg.className = 'msg err';
      msg.textContent = '⚠️ ' + r.error.message;
      btn.disabled = false;
      btn.textContent = '💾 حفظ كلمة المرور الجديدة';
      return;
    }
    msg.className = 'msg ok';
    msg.innerHTML = '✅ تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى صفحة الدخول…';
    btn.textContent = '✅ تم';
    setTimeout(function(){
      try { sb.auth.signOut(); } catch(e){}
      location.href = 'super-admin.html';
    }, 1800);
  } catch(e) {
    msg.className = 'msg err';
    msg.textContent = '⚠️ ' + e.message;
    btn.disabled = false;
    btn.textContent = '💾 حفظ كلمة المرور الجديدة';
  }
}

function parseHashParams() {
  var h = (location.hash || '').replace(/^#/, '');
  var out = {};
  if (!h) return out;
  h.split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if (i < 0) { out[decodeURIComponent(kv)] = ''; return; }
    out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  return out;
}

async function init() {
  if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
    showError('مكتبة Supabase لم تُحمَّل. تحقق من اتصال الإنترنت.');
    return;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime:{ enabled:false } });
  } catch(e) {
    showError('خطأ في تهيئة Supabase: ' + e.message);
    return;
  }

  var hp = parseHashParams();
  var qp = new URLSearchParams(location.search || '');
  if (hp.error_description || qp.get('error_description')) {
    showError(hp.error_description || qp.get('error_description'));
    return;
  }

  sb.auth.onAuthStateChange(function(event, session) {
    if (event === 'PASSWORD_RECOVERY' && session) {
      recoveryReady = true;
      showForm(session.user && session.user.email);
    }
  });

  var code = qp.get('code');
  if (code && sb.auth.exchangeCodeForSession) {
    try {
      var ex = await sb.auth.exchangeCodeForSession(code);
      if (ex && ex.error) { showError(ex.error.message); return; }
      if (ex && ex.data && ex.data.session) {
        recoveryReady = true;
        showForm(ex.data.session.user && ex.data.session.user.email);
        return;
      }
    } catch(e) {
      showError(e.message);
      return;
    }
  }

  setTimeout(async function(){
    if (recoveryReady) return;
    try {
      var s = await sb.auth.getSession();
      var sess = s && s.data && s.data.session;
      if (sess) {
        recoveryReady = true;
        showForm(sess.user && sess.user.email);
      } else {
        showError('الرابط غير صالح أو انتهت صلاحيته. يرجى طلب رابط إعادة تعيين جديد من صفحة الدخول.');
      }
    } catch(e) {
      showError(e.message);
    }
  }, 1200);
}

document.addEventListener('DOMContentLoaded', function(){
  var b = document.getElementById('btn-save');
  if (b) b.addEventListener('click', savePassword);
  ['pw1','pw2'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.addEventListener('keydown', function(e){ if (e.key === 'Enter') savePassword(); });
  });
  init();
});
</script>
  <script src="analytics.js?v=1" data-site="wadi-el-sit"></script>
</body>
</html>
