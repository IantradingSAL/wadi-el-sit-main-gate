<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a6eb5">
<title>البريد الوارد — بلدية وادي الست</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<style>
:root{
  --blue:#1a6eb5;--blue2:#0f4d82;--blue3:#daeaf8;--blue4:#f0f5fa;
  --green:#28a745;--green3:#d4edda;
  --amber:#ffc107;--amber3:#fff3cd;
  --red:#dc3545;--red3:#f8d7da;
  --cyan:#17a2b8;--cyan3:#d1ecf1;
  --purple:#6f42c1;--purple3:#e2d9f3;
  --bg:#f0f2f7;--surface:#fff;
  --text:#1a2332;--text2:#4a5568;--text3:#8a95a3;--text4:#bcc4cf;
  --border:#e0e6ef;
  --shadow-sm:0 1px 3px rgba(15,77,130,.06);
  --shadow:0 4px 20px rgba(15,77,130,.1);
  --r:12px;--r2:16px;
  --font:'Tajawal',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;background:none;color:inherit}
input,select{font-family:var(--font);outline:none;color:inherit}

header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:22px 20px;box-shadow:0 4px 16px rgba(15,77,130,.2)}
.container{max-width:1100px;margin:0 auto;padding:0 16px}
header .container{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:22px;font-weight:900;letter-spacing:-.3px}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-btn{background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:100px;font-size:12.5px;font-weight:700;transition:.2s}
.hdr-btn:hover{background:rgba(255,255,255,.25)}
.hdr-btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35)}

.tools{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:10}
.tools .container{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:100px;background:var(--blue4);color:var(--text2);font-size:12px;font-weight:700;transition:.15s;border:1px solid transparent}
.chip.active{background:var(--blue);color:#fff}
.chip:not(.active):hover{background:var(--blue3);color:var(--blue2)}
.search{flex:1;min-width:180px;padding:9px 14px;border:1px solid var(--border);border-radius:100px;background:var(--bg);font-size:13px}
.search:focus{border-color:var(--blue);background:#fff}
.stats{display:flex;gap:10px;font-size:12px;color:var(--text3);font-weight:700}
.stats b{color:var(--blue2);font-weight:900;font-size:14px}

main{padding:20px 0 60px}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:.15s;cursor:pointer}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card.replied{opacity:.85}
.card.unhandled{border-inline-start:4px solid var(--amber)}
.card.handled{border-inline-start:4px solid var(--green)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-from{font-weight:800;color:var(--blue2);font-size:14px}
.card-meta{font-size:11.5px;color:var(--text3);font-weight:600;text-align:end;line-height:1.5;white-space:nowrap}
.card-subject{font-weight:700;color:var(--text);margin-bottom:3px}
.card-snippet{color:var(--text2);font-size:12.5px;line-height:1.55;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-badges{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:10.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.badge.mailbox{background:var(--blue4);color:var(--blue2);text-transform:none;letter-spacing:0;font-size:11px}
.badge.cat-general{background:#ecf1f7;color:#4a5568}
.badge.cat-water{background:var(--cyan3);color:#0c5460}
.badge.cat-coop{background:var(--green3);color:#155724}
.badge.cat-bus{background:var(--amber3);color:#856404}
.badge.cat-mrs{background:var(--purple3);color:#492b7d}
.badge.cat-internal{background:#e2e5ea;color:#4a5568}
.badge.replied{background:var(--green3);color:#155724}
.badge.pending{background:var(--amber3);color:#856404}
.badge.autoreply{background:#f8d7da;color:#721c24}
.ticket{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:4px;font-weight:700}

.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-icon{font-size:64px;margin-bottom:12px;opacity:.35}
.empty h3{font-size:18px;color:var(--text2);margin-bottom:5px;font-weight:800}
.empty p{font-size:13px}

.detail-bg{position:fixed;inset:0;background:rgba(15,77,130,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.detail-card{background:var(--surface);border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:up .3s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.detail-head{background:linear-gradient(120deg,var(--blue2),var(--blue));color:#fff;padding:24px 24px 20px}
.detail-head h2{font-size:18px;font-weight:900;line-height:1.3;margin-bottom:6px;word-break:break-word}
.detail-close{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:900}
.detail-body{padding:22px 24px}
.detail-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-row .k{color:var(--text3);font-weight:700;min-width:90px}
.detail-row .v{color:var(--text);word-break:break-word;flex:1}
.detail-snippet{background:var(--blue4);padding:14px;border-radius:var(--r);margin-top:14px;color:var(--text);font-size:13px;line-height:1.7;white-space:pre-wrap}
.detail-actions{display:flex;gap:8px;padding:16px 24px 22px;background:var(--bg);border-top:1px solid var(--border);flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:var(--r);font-weight:800;font-size:13px;transition:.15s;flex:1;min-width:120px;text-align:center}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue2)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{filter:brightness(.92)}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg)}

.login-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.login-card{background:var(--surface);border-radius:20px;max-width:400px;width:100%;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.3);text-align:center}
.login-card h2{font-size:22px;color:var(--blue2);margin-bottom:6px;font-weight:900}
.login-card p{color:var(--text3);font-size:13px;margin-bottom:22px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;background:var(--bg);margin-bottom:10px}
.login-card input:focus{border-color:var(--blue);background:#fff}
.login-card .err{color:var(--red);font-size:12px;margin-top:6px;min-height:16px;font-weight:700}
.login-card .btn{margin-top:8px;width:100%}

.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:300;animation:pop .3s}
html[dir=rtl] .toast{transform:translateX(-50%)}
@keyframes pop{from{transform:translateX(50%) translateY(20px);opacity:0}}

@media (max-width:700px){
  header h1{font-size:18px}
  .card{padding:12px 14px}
  .card-meta{font-size:11px}
  .stats{width:100%;justify-content:space-around;padding-top:6px;border-top:1px dashed var(--border)}
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div>
      <h1>📧 البريد الوارد</h1>
      <div class="sub">إدارة الرسائل الواردة إلى بلدية وادي الست</div>
    </div>
    <div class="hdr-actions">
      <a href="dashboard.html" class="hdr-btn ghost">◀ لوحة التحكم</a>
      <button class="hdr-btn" id="signout">تسجيل الخروج</button>
    </div>
  </div>
</header>

<div class="tools">
  <div class="container">
    <div class="chip-row" id="cats">
      <button class="chip active" data-cat="">الكل</button>
      <button class="chip" data-cat="general">عام</button>
      <button class="chip" data-cat="water">مياه</button>
      <button class="chip" data-cat="coop">تعاونية</button>
      <button class="chip" data-cat="bus">باص</button>
      <button class="chip" data-cat="mrs">مكلفين</button>
      <button class="chip" data-cat="internal">داخلي</button>
    </div>
    <div class="chip-row" id="mailboxes"></div>
    <div class="chip-row">
      <button class="chip" data-scope="unhandled">قيد المعالجة</button>
      <button class="chip" data-scope="unreplied">بدون رد</button>
    </div>
    <input type="text" class="search" id="search" placeholder="بحث بالمرسل أو الموضوع أو رقم المرجع…">
    <div class="stats">
      <span>الكل: <b id="stat-total">0</b></span>
      <span>لم يُعالَج: <b id="stat-open">0</b></span>
    </div>
  </div>
</div>

<main>
  <div class="container">
    <div class="list" id="list">
      <div class="empty">
        <div class="empty-icon">⏳</div>
        <h3>جارٍ التحميل…</h3>
      </div>
    </div>
  </div>
</main>

<div id="detail"></div>
<div id="login-mount"></div>
<div id="toast-mount"></div>

<script>
const SB_URL = 'https://onjbwhkmmtqnymhjnplw.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uamJ3aGttbXRxbnltaGpucGx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MDY4MjUsImV4cCI6MjA5MDM4MjgyNX0.lhlsRdOqVHZuOXCJa0lCNuZkYJHhf1AZ_zOwqHHAeG4';
const sb = supabase.createClient(SB_URL, SB_KEY);

const state = {
  rows: [],
  filter: { cat: '', mailbox: '', scope: '', q: '' },
};

function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function fmtWhen(iso){
  const d = new Date(iso);
  const now = Date.now();
  const diff = (now - d.getTime()) / 1000;
  if (diff < 60) return 'الآن';
  if (diff < 3600) return `منذ ${Math.floor(diff/60)} د`;
  if (diff < 86400) return `منذ ${Math.floor(diff/3600)} س`;
  const opts = { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' };
  return d.toLocaleString('ar-EG', opts);
}

const CAT_LABELS = {
  general: 'عام', water: 'مياه', coop: 'تعاونية', bus: 'باص', mrs: 'مكلفين', internal: 'داخلي'
};

function toast(msg){
  const m = document.getElementById('toast-mount');
  m.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  setTimeout(() => { m.innerHTML = ''; }, 2400);
}

function showLogin(errMsg){
  document.getElementById('login-mount').innerHTML = `
    <div class="login-bg">
      <div class="login-card">
        <h2>🔒 تسجيل الدخول</h2>
        <p>البريد الوارد متاح للإدارة فقط</p>
        <input type="email" id="login-email" placeholder="البريد الإلكتروني" autocomplete="username">
        <input type="password" id="login-pass" placeholder="كلمة المرور" autocomplete="current-password">
        <div class="err">${esc(errMsg || '')}</div>
        <button class="btn btn-primary" id="do-login">دخول</button>
      </div>
    </div>`;
  document.getElementById('do-login').onclick = doLogin;
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
function hideLogin(){ document.getElementById('login-mount').innerHTML = ''; }

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) return;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return showLogin(error.message);
  hideLogin();
  init();
}

document.getElementById('signout').onclick = async () => {
  await sb.auth.signOut();
  state.rows = [];
  render();
  showLogin();
};

function passesFilter(r){
  const f = state.filter;
  if (f.cat && r.category !== f.cat) return false;
  if (f.mailbox && r.mailbox !== f.mailbox) return false;
  if (f.scope === 'unhandled' && r.handled_at) return false;
  if (f.scope === 'unreplied' && r.replied) return false;
  if (f.q) {
    const q = f.q.toLowerCase();
    const hay = `${r.from_email} ${r.from_name} ${r.subject} ${r.snippet} ${r.ticket_id}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const filtered = state.rows.filter(passesFilter);
  const total = state.rows.length;
  const open = state.rows.filter(r => !r.handled_at).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-open').textContent = open;

  const mailboxes = [...new Set(state.rows.map(r => r.mailbox))].sort();
  const mbRow = document.getElementById('mailboxes');
  if (mailboxes.length) {
    mbRow.innerHTML =
      `<button class="chip ${state.filter.mailbox === '' ? 'active' : ''}" data-mb="">كل الصناديق</button>` +
      mailboxes.map(mb => {
        const short = mb.split('@')[0];
        return `<button class="chip ${state.filter.mailbox === mb ? 'active' : ''}" data-mb="${esc(mb)}" title="${esc(mb)}">${esc(short)}</button>`;
      }).join('');
  }

  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><h3>لا توجد رسائل</h3><p>لم يتم استلام أي رسالة تطابق الفلتر الحالي.</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(r => `
    <div class="card ${r.replied ? 'replied' : ''} ${r.handled_at ? 'handled' : 'unhandled'}" data-id="${r.id}">
      <div class="card-head">
        <div>
          <div class="card-from">${esc(r.from_name || r.from_email)}${r.from_name ? ` <span style="color:var(--text3);font-weight:500;font-size:12px">&lt;${esc(r.from_email)}&gt;</span>` : ''}</div>
        </div>
        <div class="card-meta">${fmtWhen(r.received_at)}<br><span class="ticket">${esc(r.ticket_id || '—')}</span></div>
      </div>
      <div class="card-subject">${esc(r.subject || '(بدون موضوع)')}</div>
      <div class="card-snippet">${esc(r.snippet || '—')}</div>
      <div class="card-badges">
        <span class="badge mailbox">📮 ${esc(r.mailbox.split('@')[0])}</span>
        <span class="badge cat-${esc(r.category)}">${esc(CAT_LABELS[r.category] || r.category)}</span>
        ${r.replied ? '<span class="badge replied">✓ تم الرد التلقائي</span>' : ''}
        ${r.handled_at ? '<span class="badge replied">✓ تمت المعالجة</span>' : '<span class="badge pending">⏳ قيد المعالجة</span>'}
        ${r.is_auto_reply ? '<span class="badge autoreply">رد آلي</span>' : ''}
      </div>
    </div>`).join('');

  list.querySelectorAll('.card').forEach(el => {
    el.onclick = () => showDetail(+el.dataset.id);
  });
}

function showDetail(id){
  const r = state.rows.find(x => x.id === id);
  if (!r) return;
  document.getElementById('detail').innerHTML = `
    <div class="detail-bg" id="detail-bg">
      <div class="detail-card" onclick="event.stopPropagation()">
        <div class="detail-head" style="position:relative">
          <button class="detail-close" id="detail-close">×</button>
          <h2>${esc(r.subject || '(بدون موضوع)')}</h2>
          <div style="opacity:.85;font-size:12.5px">${fmtWhen(r.received_at)} · <span class="ticket" style="background:rgba(255,255,255,.2);color:#fff">${esc(r.ticket_id || '—')}</span></div>
        </div>
        <div class="detail-body">
          <div class="detail-row"><div class="k">من</div><div class="v">${esc(r.from_name)} &lt;${esc(r.from_email)}&gt;</div></div>
          <div class="detail-row"><div class="k">إلى</div><div class="v">${esc((r.to_emails || []).join(', '))}</div></div>
          <div class="detail-row"><div class="k">الصندوق</div><div class="v">${esc(r.mailbox)}</div></div>
          <div class="detail-row"><div class="k">التصنيف</div><div class="v">${esc(CAT_LABELS[r.category] || r.category)}</div></div>
          <div class="detail-row"><div class="k">التاريخ</div><div class="v">${new Date(r.received_at).toLocaleString('ar-EG')}</div></div>
          <div class="detail-row"><div class="k">Message-ID</div><div class="v" style="font-family:monospace;font-size:11.5px;color:var(--text3)">${esc(r.message_id || '—')}</div></div>
          <div class="detail-snippet">${esc(r.snippet || '(لا يوجد نص متوفر)')}</div>
        </div>
        <div class="detail-actions">
          <a href="mailto:${esc(r.from_email)}?subject=${encodeURIComponent('Re: ' + (r.subject || ''))}" class="btn btn-primary">✉ رد يدوي</a>
          ${r.handled_at
            ? '<button class="btn btn-ghost" disabled>✓ تمت المعالجة</button>'
            : `<button class="btn btn-green" id="mark-handled">✓ وضع علامة مُعالج</button>`}
          <button class="btn btn-ghost" id="close-detail">إغلاق</button>
        </div>
      </div>
    </div>`;
  const close = () => { document.getElementById('detail').innerHTML = ''; };
  document.getElementById('detail-bg').onclick = close;
  document.getElementById('detail-close').onclick = close;
  document.getElementById('close-detail').onclick = close;
  const mark = document.getElementById('mark-handled');
  if (mark) mark.onclick = async () => {
    mark.disabled = true; mark.textContent = 'جارٍ الحفظ…';
    const user = (await sb.auth.getUser()).data.user;
    const { error } = await sb.from('incoming_emails').update({
      handled_by: user?.id ?? null,
      handled_at: new Date().toISOString(),
    }).eq('id', r.id);
    if (error) { mark.disabled = false; mark.textContent = '✓ وضع علامة مُعالج'; toast('خطأ: ' + error.message); return; }
    toast('تم وضع علامة على الرسالة');
    close();
    await loadAll();
  };
}

async function loadAll(){
  const { data, error } = await sb.from('incoming_emails')
    .select('*')
    .order('received_at', { ascending: false })
    .limit(200);
  if (error) {
    document.getElementById('list').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>خطأ في التحميل</h3><p>${esc(error.message)}</p></div>`;
    return;
  }
  state.rows = data || [];
  render();
}

// Filter chip wiring
document.getElementById('cats').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]'); if (!btn) return;
  state.filter.cat = btn.dataset.cat;
  document.querySelectorAll('#cats .chip').forEach(c => c.classList.toggle('active', c === btn));
  render();
});
document.getElementById('mailboxes').addEventListener('click', e => {
  const btn = e.target.closest('[data-mb]'); if (!btn) return;
  state.filter.mailbox = btn.dataset.mb;
  render();
});
document.querySelectorAll('[data-scope]').forEach(btn => {
  btn.onclick = () => {
    state.filter.scope = (state.filter.scope === btn.dataset.scope) ? '' : btn.dataset.scope;
    document.querySelectorAll('[data-scope]').forEach(b => b.classList.toggle('active', b === btn && state.filter.scope));
    render();
  };
});
document.getElementById('search').oninput = e => {
  state.filter.q = e.target.value.trim();
  render();
};

async function init(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { showLogin(); return; }
  hideLogin();
  await loadAll();

  // Realtime: new inserts + updates
  sb.channel('incoming_emails_realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'incoming_emails' }, async payload => {
      if (payload.eventType === 'INSERT') toast('📬 رسالة جديدة');
      await loadAll();
    })
    .subscribe();
}

init();
</script>
